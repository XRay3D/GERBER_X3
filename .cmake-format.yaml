# Единый стиль для CMakeLists.txt и *.cmake.
# Раньше конфига не было, и ветки расходились на отступе (2 против 4),
# из-за чего каждое слияние давало конфликт во весь файл.
#
# Прогнать по всему дереву:
#   cmake-format -i CMakeLists.txt PATHS.cmake $(git ls-files '*/CMakeLists.txt' '*.cmake')

format:
  tab_size: 2
  use_tabchars: false
  line_width: 80
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  dangle_parens: false
  command_case: lower
  keyword_case: upper

markup:
  enable_markup: false
