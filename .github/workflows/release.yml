name: Build & Release

# Собирает GGEasy для Windows (MSYS2 UCRT64) при пуше в master и при пуше тега
# версии, затем публикует zip-архив в GitHub Releases.
#
# Архив самодостаточен: рядом с бинарниками кладутся Qt-плагины (windeployqt)
# и весь рантайм MSYS2/UCRT64 (libgcc, libstdc++, libwinpthread, Boost, ICU
# и прочие транзитивные зависимости из /ucrt64/bin).
#
# ВНИМАНИЕ: проект использует экспериментальную статическую рефлексию C++26
# (std::meta, -freflection), поэтому нужен GCC 16. Это очень свежий тулчейн —
# шаг установки может потребовать корректировки, если пакеты MSYS2 изменятся.
#
# Точная геометрия (static_libs/geo) собирается на CGAL, поэтому в списке
# пакетов он обязателен: без него find_package(CGAL) молча не находит ничего
# (он QUIET), конфигурация проходит, а сборка падает уже на <CGAL/...>.
# Пакет тянет за собой boost, eigen3, gmp и mpfr.
#
# mimalloc в списке тоже не случаен: без него GEO_USE_MIMALLOC молча
# откатывается на системный malloc (find_library-фолбэк), и релиз теряет
# аллокатор точной арифметики. libmimalloc.dll попадает в архив общим
# ldd-обходом рантайма ниже.
#
# Версия CGAL не пинуется (pacman ставит текущую из MSYS2). Теневая копия
# CGAL/Lazy.h (static_libs/geo/src/cgal_shadow) написана поверх CGAL 6.2 и
# несёт страж версии: когда MSYS2 обновит пакет, сборка НАРОЧНО упадёт с
# #error -- надо пересравнить копию с новой Lazy.h и обновить её. Это не
# поломка CI, а напоминание.

on:
  push:
    branches: [master]
    tags: ["[0-9]+.[0-9]+*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"

      - name: Setup MSYS2 (UCRT64, GCC 16)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cgal
            mingw-w64-ucrt-x86_64-mimalloc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-mesa
            git
            zip

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGERBER_NATIVE_MARCH=OFF \
            -DGIT_REF_NAME=${{ github.ref_name }} \
            -DGIT_SHA=${{ github.sha }}

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Package
        run: |
          set -eu
          BIN_DIR="$(dirname "$(find bin -maxdepth 3 -type d -name plugins)")"
          VERSION="${{ github.ref_name }}"
          OUT="GGEasy-${VERSION}-windows-x64"

          mkdir -p "$OUT"
          cp -r "$BIN_DIR"/* "$OUT"/

          # Qt-плагины (platforms/, styles/, imageformats/, iconengines/) и
          # сами Qt6*.dll. Плагины приложения передаём windeployqt явно, иначе
          # их собственные Qt-зависимости не попадут в архив: они грузятся
          # через QPluginLoader и в импортах GGEasy.exe не видны.
          windeployqt6 --release --no-translations --no-system-d3d-compiler \
            "$OUT/GGEasy.exe" "$OUT"/plugins/*.dll

          # Программный OpenGL (Mesa llvmpipe) под именем, которое ищет Qt.
          # Нужен машинам с битым драйвером видеокарты: OpenGlCheck переводит
          # их в режим software, и без этой библиотеки переводить не на что --
          # останется растровый вывод без 3D-просмотра. Кладём до обхода
          # зависимостей ниже, чтобы её собственные DLL тоже подтянулись.
          if [ -f /ucrt64/bin/opengl32.dll ]; then
            cp -v /ucrt64/bin/opengl32.dll "$OUT/opengl32sw.dll"
          else
            echo "::warning::Mesa opengl32.dll не найдена -- программный OpenGL в архив не попадёт"
          fi

          # Рантайм MSYS2/UCRT64. windeployqt тянет только Qt, поэтому
          # libgcc_s_seh-1, libstdc++-6, libwinpthread-1, Boost, ICU, zlib и
          # прочее добираем сами. Обход повторяем до фиксированной точки:
          # у скопированных DLL есть свои зависимости.
          # ldd в MSYS2 печатает путь то в POSIX-виде (/ucrt64/bin/...), то в
          # Windows-виде (C:/msys64/ucrt64/bin/...) — принимаем оба и нормализуем
          # через cygpath.
          while :; do
            BEFORE="$(find "$OUT" -name '*.dll' | wc -l)"
            find "$OUT" \( -name '*.exe' -o -name '*.dll' \) -print0 \
              | xargs -0 -r -n1 ldd 2>/dev/null \
              | awk '{for (i = 1; i < NF; i++) if ($i == "=>") print $(i + 1)}' \
              | grep -Ei 'ucrt64[/\\]bin' \
              | sort -u \
              | while read -r dll; do
                  src="$(cygpath -u "$dll" 2>/dev/null || echo "$dll")"
                  [ -f "$src" ] || continue
                  [ -f "$OUT/$(basename "$src")" ] || cp -v "$src" "$OUT"/
                done
            AFTER="$(find "$OUT" -name '*.dll' | wc -l)"
            if [ "$BEFORE" = "$AFTER" ]; then break; fi
          done

          # Страховка: без этих трёх приложение не стартует на машине без MSYS2.
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ ! -f "$OUT/$dll" ]; then
              echo "::error::рантайм MSYS2 не попал в архив: $dll"
              exit 1
            fi
          done

          echo "Файлов в архиве: $(find "$OUT" -type f | wc -l), размер: $(du -sh "$OUT" | cut -f1)"
          zip -r "${OUT}.zip" "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGEasy-windows-zip
          path: GGEasy-*-windows-x64.zip
          if-no-files-found: error

  # Linux-сборка (amd64) в контейнере Debian sid.
  #
  # Почему sid, а не ubuntu-latest: проекту нужен релизный GCC 16 со статической
  # рефлексией (-freflection). В Ubuntu 26.04 gcc-16 есть только мартовским
  # снапшотом 16-20260322, который НЕ собирает serial.h (строже правила
  # odr-use/consteval у consteval-инициализированных переменных). Нормальный
  # g++-16 16.2.0 есть в Debian sid; заодно оттуда же CGAL 6.2 (теневая
  # Lazy.h требует ровно её), Qt 6.11 (operator""_sv для QStringView появился
  # в 6.10) и Boost >= 1.85 (stacktrace::from_current_exception).
  #
  # Побочный эффект sid -- свежий glibc: архив требует glibc >= 2.43 на машине
  # пользователя (Ubuntu 26.04+, Debian trixie+). libstdc++ кладём в архив
  # свой, так что он не ограничение.
  #
  # Архив самодостаточен: Qt-библиотеки и плагины, ICU, mimalloc и прочие
  # зависимости собираем ldd-обходом до фиксированной точки (как в Windows-job),
  # RPATH всех ELF -- на $ORIGIN. Ядро glibc (libc, libm, ld-linux, ...) не
  # копируем: подмена libc в каталоге рядом с бинарником ломает загрузку.
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:sid
    steps:
      # git и ca-certificates нужны ДО checkout: сабмодули в контейнере
      # качаются системным git, которого в debian:sid нет.
      - name: Install toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-16 g++-16 \
            cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-l10n-tools \
            libcgal-dev libboost-dev libmimalloc-dev libicu-dev libtbb-dev \
            patchelf file tar git ca-certificates

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DGERBER_NATIVE_MARCH=OFF \
            -DGIT_REF_NAME=${{ github.ref_name }} \
            -DGIT_SHA=${{ github.sha }}

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Package
        run: |
          set -eu
          BIN_DIR="$(dirname "$(find bin -maxdepth 3 -type d -name plugins)")"
          # В имени ветки могут быть слэши ("ci/linux-build"): в имени
          # архива их быть не должно, иначе tar.gz уедет во вложенный
          # каталог и upload-artifact его не найдёт. tr, а не ${var//}:
          # шаг выполняется в sh (dash), башизмы недоступны.
          VERSION="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          OUT="GGEasy-${VERSION}-linux-x64"
          QT_PLUGINS=/usr/lib/x86_64-linux-gnu/qt6/plugins

          mkdir -p "$OUT"
          cp -r "$BIN_DIR"/* "$OUT"/

          # Qt-плагины (platforms/xcb, imageformats, iconengines/svg, styles)
          # складываем в тот же plugins/, что и плагины приложения, и
          # переключаем поиск Qt туда через qt.conf. Плагины приложения
          # грузятся по явному пути, подкаталоги Qt им не мешают.
          for d in platforms styles imageformats iconengines; do
            [ -d "$QT_PLUGINS/$d" ] && cp -r "$QT_PLUGINS/$d" "$OUT/plugins/"
          done
          printf '[Paths]\nPlugins = plugins\nTranslations = translations\n' \
            > "$OUT/qt.conf"

          # Рантайм: ldd-обход до фиксированной точки. Копируем зависимости из
          # /usr/lib и /lib, КРОМЕ ядра glibc и его модулей -- подменённый libc
          # рядом с бинарником игнорируется загрузчиком, а вот чужой libc в
          # LD_LIBRARY_PATH ломает системные библиотеки пользователя.
          is_bundleable() {
            case "$1" in
              ld-linux*|libc\.so*|libm\.so*|libdl*|libpthread*|librt*|libresolv*|\
              libnss_*|libnsl*|libanl*|libutil*|libBrokenLocale*|libSegFault*|\
              libgcc_s*) return 1 ;;
              *) return 0 ;;
            esac
          }
          mkdir -p "$OUT/lib"
          while :; do
            BEFORE="$(find "$OUT" -name '*.so*' | wc -l)"
            find "$OUT" \( -type f -o -type l \) \( -name 'GGEasy' -o -name '*.so*' \) -print0 \
              | xargs -0 -r -n1 file \
              | awk -F: '/ELF/{print $1}' \
              | while read -r elf; do
                  ldd "$elf" 2>/dev/null \
                  | awk '{for (i = 1; i < NF; i++) if ($i == "=>") print $(i + 1)}' \
                  | while read -r lib; do
                      [ -f "$lib" ] || continue
                      case "$lib" in /usr/lib/*|/lib/*) ;; *) continue ;; esac
                      base="$(basename "$lib")"
                      is_bundleable "$base" || continue
                      [ -e "$OUT/lib/$base" ] || cp -L "$lib" "$OUT/lib/"
                    done
                done
            AFTER="$(find "$OUT" -name '*.so*' | wc -l)"
            if [ "$BEFORE" = "$AFTER" ]; then break; fi
          done

          # Страховка: Qt и рантайм C++ обязаны попасть в архив.
          ls "$OUT"/lib/libQt6Core.so.6 >/dev/null
          ls "$OUT"/lib/libstdc++.so.6 >/dev/null
          ls "$OUT/plugins/platforms"/libqxcb.so >/dev/null

          # RPATH: главный бинарник и libggcore ищут библиотеки в lib/,
          # плагины -- на уровень выше и в lib/, всё в lib/ -- в самом lib/.
          patchelf --set-rpath '$ORIGIN:$ORIGIN/lib' "$OUT/GGEasy" "$OUT/libggcore.so"
          find "$OUT/plugins" -name '*.so' -exec \
            patchelf --set-rpath '$ORIGIN/..:$ORIGIN/../lib' {} +
          find "$OUT/lib" -name '*.so*' -exec \
            patchelf --set-rpath '$ORIGIN' {} +

          # .desktop для тех, кто кладёт архив в ~/.local/opt.
          mkdir -p "$OUT/share"
          cp packaging/linux/ggeasy.desktop "$OUT/share/"

          echo "Файлов в архиве: $(find "$OUT" -type f | wc -l), размер: $(du -sh "$OUT" | cut -f1)"
          tar -czf "${OUT}.tar.gz" "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGEasy-linux-targz
          path: GGEasy-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build changelog
        id: changelog
        run: |
          set -eu
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PREV_TAG="$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n1 || true)"
          else
            PREV_TAG="$(git tag --sort=-creatordate | head -n1 || true)"
          fi

          {
            echo "log<<EOF"
            if [[ -n "$PREV_TAG" ]]; then
              echo "Изменения с $PREV_TAG:"
              echo
              git log --no-merges --pretty="- %s (%h)" "$PREV_TAG"..HEAD
            else
              echo "Изменения:"
              echo
              git log --no-merges --pretty="- %s (%h)" -n 50
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GGEasy ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.log }}
          prerelease: false
          files: dist/**

      - name: Publish rolling master build
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "GGEasy (master, continuous build)"
          body: ${{ steps.changelog.outputs.log }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/**
