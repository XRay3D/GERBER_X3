<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" font-family="Verdana, Arial, sans-serif">
  <style>
    .stroke  { fill:none; stroke:#1a1a1a; stroke-width:2.5; }
    .pt      { fill:#1a1a1a; }
    .lbl     { font-size:17px; fill:#1a1a1a; font-weight:bold; }
    .lbl-sm  { font-size:13px; fill:#5a5a5a; }
    .arrow   { fill:#1a1a1a; }
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="arrow"/>
    </marker>
  </defs>

  <!-- Cw -->
  <g transform="translate(60,30)">
    <path class="stroke" d="M60,90 A55,55 0 1,1 60,89.9" marker-end="url(#arr)"/>
    <text class="lbl" x="20" y="185">Cw = -1</text>
    <text class="lbl-sm" x="0" y="205">bulge &lt; 0, по часовой</text>
  </g>

  <!-- Line -->
  <g transform="translate(240,30)">
    <line class="stroke" x1="0" y1="90" x2="115" y2="90" marker-end="url(#arr)"/>
    <text class="lbl" x="20" y="185">Line = 0</text>
    <text class="lbl-sm" x="6" y="205">bulge == 0, прямая</text>
  </g>

  <!-- Ccw -->
  <g transform="translate(420,30)">
    <path class="stroke" d="M60,90 A55,55 0 1,0 60,89.9" marker-end="url(#arr)"/>
    <text class="lbl" x="10" y="185">Ccw = +1</text>
    <text class="lbl-sm" x="0" y="205">bulge &gt; 0, против часовой</text>
  </g>
</svg>
